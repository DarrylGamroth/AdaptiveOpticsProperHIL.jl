schema_version = 1
name = "proper_propagation"

[[nodes]]
name = "proper"
type = "proper_propagation_f32"

[nodes.config]
resolution = 8
diameter_m = 8.0
wavelength_um = 1.65
rng_seed = 17

[[inputs]]
name = "pupil_opd"
destination = "proper.pupil_opd"
binding = "pupil_opd"

[[inputs]]
name = "pupil_amplitude"
destination = "proper.pupil_amplitude"
binding = "pupil_amplitude"

[[outputs]]
name = "intensity"
source = "proper.output"
